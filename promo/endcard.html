<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px;
    background: radial-gradient(ellipse at 50% 30%, #1a3a5c 0%, #0b0f14 55%, #05070a 100%);
    color: #e8eef7;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #3d9cf0, #6366f1);
    display: grid; place-items: center; font-size: 2rem;
    box-shadow: 0 0 40px rgba(61,156,240,0.45);
  }
  h1 {
    font-size: 4rem; letter-spacing: -0.03em; font-weight: 800;
  }
  .sub { color: #93a4b8; font-size: 1.35rem; }
  .url {
    margin-top: 0.5rem;
    font-size: 2rem; font-weight: 700; color: #93c5fd;
    font-family: ui-monospace, Menlo, monospace;
    background: rgba(255,255,255,0.04);
    border: 1px solid #243041;
    border-radius: 14px;
    padding: 0.85rem 1.5rem;
  }
  .cta {
    margin-top: 0.75rem;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1a1205; font-weight: 800; font-size: 1.1rem;
    border-radius: 999px; padding: 0.75rem 1.75rem;
  }
  .tags { color: #6b7c90; font-size: 0.95rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>GetNow</h1>
  <p class="sub">Learn · Build · Share — free tech library &amp; tools</p>
  <div class="url">getnow-app.vercel.app</div>
  <div class="cta">Start free · Get Pro $12</div>
  <p class="tags">Library · Chat · Vault · Journal · News · Labs</p>
</body>
</html>
